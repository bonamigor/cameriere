spring.application.name=Il cameriere
spring.profiles.active=dev

# Railway (e similares) injeta PORT; local permanece 8080
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.serialization.write-dates-as-timestamps=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Sem valor padrão: a aplicação não sobe sem JWT_SECRET (mínimo 32 caracteres).
# Gere com: openssl rand -base64 48
cameriere.security.jwt.secret=${JWT_SECRET}
cameriere.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Origens CORS (Vercel + local). Separe por vírgula.
# Ex.: https://consumatore.vercel.app,http://localhost:3000
cameriere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cookie HttpOnly que carrega o JWT
cameriere.security.cookie.name=cameriere_token
cameriere.security.cookie.secure=${COOKIE_SECURE:true}
cameriere.security.cookie.same-site=Lax

