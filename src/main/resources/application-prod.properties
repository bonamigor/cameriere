# Prefer vars nativas do MySQL no Railway (MYSQLHOST, etc.).
# DB_URL opcional: use apenas se for JDBC completo (jdbc:mysql://...).
# NÃO use mysql://... — Spring não aceita esse formato.

spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD}}

spring.jpa.show-sql=false

cameriere.seed.enabled=false

# Defina no Railway a origem do frontend na Vercel (vírgula para várias)
# CORS_ALLOWED_ORIGINS=https://seu-app.vercel.app
cameriere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
