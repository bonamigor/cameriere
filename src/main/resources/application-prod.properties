# Vars do plugin MySQL no Railway (mesmo projeto, Variable Reference).
# NÃO defina DB_URL no Railway — deixe estas vars resolvidas:
#   MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.show-sql=false

cameriere.seed.enabled=false

# Origem do frontend na Vercel
cameriere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Documentação da API não fica exposta em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
