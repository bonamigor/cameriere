# Vars do plugin MySQL no Railway (mesmo projeto, Variable Reference).
# NÃO defina DB_URL no Railway — deixe estas vars resolvidas:
#   MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.show-sql=false

cameriere.seed.enabled=false

# Origem do frontend na Vercel
cameriere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
