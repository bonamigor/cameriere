spring.datasource.url=jdbc:mysql://localhost:3306/jubo_new?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cameriere.seed.enabled=false

# Apenas para desenvolvimento/testes locais — nunca use em produção
cameriere.security.jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-0123456789}
cameriere.security.cookie.secure=false
